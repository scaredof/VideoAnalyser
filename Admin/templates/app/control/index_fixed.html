{% extends "app/base_site.html" %}

{% block title %} 布控管理 {% endblock title %}

{% block stylesheets %}
  {{ block.super }}
{% endblock stylesheets %}

{% block content %}

  <div class="right_col" role="main">
    <div class="">
      <div class="row">
      <div class="col-md-12 col-sm-12 col-xs-12">
      <div class="x_panel">
        <div class="x_title">
          <h2>布控管理
            <span id="top_loading" ><img class="top_loading_img" src="/static/images/load.gif" alt="loading">加载中</span>
             <span id="top_msg"></span>
          </h2>
          <div class="clearfix"></div>
        </div>

        <div class="x_content">
        <!--<p><code>msg</code></p>-->

          <div class="table-responsive">
            <table class="table table-bordered">
              <thead>
                <tr class="headings">
                  <th class="column-title"># </th>
                  <th class="column-title">编号 </th>
                  <th class="column-title">视频流 </th>
                  <th class="column-title">算法 </th>
                  <th class="column-title">检测目标 </th>
                  <th class="column-title">状态 </th>
                  <th class="column-title last">操作 </th>
                </tr>
              </thead>
              <tbody id="data">
              </tbody>
            </table>
          </div>


        </div>
      </div>
    </div>

      </div>

    </div>
  </div>

{% endblock content %}

{% block javascripts %}
  {{ block.super }}

<script>

    let eleData = $("#data");
    let ele_top_loading = $("#top_loading");
    let ele_top_msg= $("#top_msg");

    function f_edit(code) {
        let url = "/control/edit?code="+code;
        window.location.href = url;
    }
    function f_del(code) {
        if(confirm("确定删除？")){
            $.ajax({
                url: '/api/postDelControl',
                type: "post",
                async: true,
                data: {
                    "code": code
                },
                dataType: "json",
                timeout: 0,
                error: function () {
                    myAlert("网络异常，请确定网络正常！","error");
                },
                success: function (res) {
                    if(1000 === res.code){
                        myAlert(res.msg,"success");
                        f_getControls();
                    }else{
                        myAlert(res.msg,"error");
                    }
                }
            });
        }
    }
    function f_getControls() {
        ele_top_loading.show();
        $.ajax({
               url: '/api/getControls',
               type: "get",
               async: true,
               data: {},
               dataType: "json",
               timeout: 0,
               error: function () {
                   ele_top_loading.hide();
                   myAlert("网络异常，请确定网络正常！","error");
               },
               success: function (res) {
                   ele_top_loading.hide();
                   let top_msg = res.top_msg;
                   ele_top_msg.html(top_msg);

                   let item_html;
                    eleData.html("");

                   if(1000 === res.code){

                       let data = res.data;
                       let data_length = data.length;

                       if(0===data_length){
                           item_html = "";
                          item_html += "<tr class=\"even pointer\"><td colspan='7'>暂无数据</td></tr>";
                           eleData.append(item_html);
                       }else{
                            for (let i = 0; i < data_length; i++) {
                                 item_html = "";
                               let d = data[i];
                               item_html += "<tr class=\"even pointer\">";
                               item_html += "<td>"+String(i+1)+"</td>";
                               item_html += "<td>"+d["code"]+"</td>";
                               item_html += "<td>"+d["stream_nickname"]+"</td>";
                               item_html += "<td>"+d["algorithm_name"]+"</td>";
                               item_html += "<td>"+d["objects"]+"</td>";

                               if(d["is_start"]){
                                   item_html += "<td><span class='label label-success'>运行中</span></td>";
                               }else{
                                   item_html += "<td><span class='label label-default'>已停止</span></td>";
                               }

                               item_html += "<td>";
                               item_html += "<a href=\"/control/edit?code="+d["code"]+"\"  class='sun-a-label' style='margin-right: 8px;' > 编辑</a>";
                               item_html += "<a href=\"javascript:f_del('"+d["code"]+"')\"  class='sun-a-label' style='margin-right: 8px;' > 删除</a>";
                               item_html += "</td>";
                               item_html += "</tr>";

                               eleData.append(item_html);
                           }
                        }

                   }else{
                        myAlert(res.msg,"error");
                   }
               }
            });

    }
    window.onload = function (){
        f_getControls();
    };


</script>
{% endblock javascripts %}
